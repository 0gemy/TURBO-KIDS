<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Kids - معاينة الإطارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:linear-gradient(#10213f,#1b0f2e);color:#fff;min-height:100vh;padding:16px 14px 60px}
.pv-note{background:#ffffff14;border-radius:12px;padding:8px 12px;font-size:13px;text-align:center;margin-bottom:12px}
.me{display:flex;align-items:center;gap:18px;background:#ffffff10;border-radius:20px;padding:22px 18px;margin-bottom:14px}
.me b{font-size:20px}.me small{display:block;opacity:.7;font-size:12px}
.coins{margin-inline-start:auto;font-weight:800;background:#0006;border-radius:14px;padding:6px 12px}
.av{position:relative;flex:none;margin:auto}
.av i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#e0f2fe,#99f6e4);display:grid;place-items:center;font-style:normal}
.av u{position:absolute;left:50%;top:50%;pointer-events:none;background:center/100% 100% no-repeat;transform:translate(-50%,-52.5%)}
h2{font-size:18px;margin:6px 4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;color:#16243b;border-radius:20px;padding:10px;text-align:center;box-shadow:0 6px 0 #0004}
.card.on{outline:3px solid #22c55e}
.pvbox{height:150px;border-radius:14px;background:radial-gradient(#26446f,#0e1d36);display:grid;place-items:center}
.card h3{margin:8px 0 0;font-size:16px}.card p{margin:2px 0 8px;font-size:12px;color:#5b6b85}
.btn{border:0;border-radius:14px;padding:10px;width:100%;font:800 15px Cairo;color:#fff;background:#f97316;box-shadow:0 4px 0 #c2410c}
.btn.on{background:#16a34a;box-shadow:0 4px 0 #166534}.btn.have{background:#2563eb;box-shadow:0 4px 0 #1d4ed8}
</style></head><body>
<div class="pv-note">معاينة فقط. اللعبة الحقيقية لم تتغير.</div>
<div class="me"><div id="me"></div><div><b>اسم اللاعب</b><small>إطارك يظهر في كل أماكن صورتك</small></div><div class="coins">◆ <span id="co">2000</span></div></div>
<h2>الإطارات</h2><div class="grid" id="g"></div>
<script src="js/frames-data-a.js"></script><script src="js/frames-data-b.js"></script>
<script>
const SV=`<svg viewBox='0 0 40 40' width='60%' height='60%'><circle cx='20' cy='14' r='8' fill='#0f766e'/><path d='M4 38c2-12 30-12 32 0z' fill='#0f766e'/></svg>`;const L=[{"id": "fr_phoenix", "n": "إطار العنقاء", "desc": "نار وريش ذهبي", "p": 400}, {"id": "fr_icedragon", "n": "إطار التنين الجليدي", "desc": "جليد وبلور أزرق", "p": 500}, {"id": "fr_forest", "n": "إطار الغابة", "desc": "زمرد وأوراق ذهبية", "p": 600}, {"id": "fr_king", "n": "إطار الملك", "desc": "تاج وألماس", "p": 700}, {"id": "fr_galaxy2", "n": "إطار المجرة", "desc": "نجوم وكواكب", "p": 850}, {"id": "fr_thunder", "n": "إطار الرعد", "desc": "برق ونسر ذهبي", "p": 1000}];let coins=2000,own={},eq='';
function av(id,s){return '<div class="av" style="width:'+s+'px;height:'+s+'px"><i style="">'+SV+'</i>'+(id?'<u style="width:'+s/.67*.97+'px;height:'+s/.67*.97+'px;background-image:url('+TKFR_IMG[id]+')"></u>':'')+'</div>'}
function draw(){document.getElementById('co').textContent=coins;
 document.getElementById('me').innerHTML=av(eq,84);
 g.innerHTML=L.map(x=>'<div class="card '+(eq===x.id?'on':'')+'"><div class="pvbox">'+av(x.id,86)+'</div><h3>'+x.n+'</h3><p>'+x.desc+'</p><button class="btn '+(eq===x.id?'on':own[x.id]?'have':'')+'" onclick="act(\''+x.id+'\')">'+(eq===x.id?'مركّب · إزالة':own[x.id]?'تركيب':'◆ '+x.p)+'</button></div>').join('')}
function act(id){const x=L.find(v=>v.id===id);if(eq===id){eq=''}else if(own[id]){eq=id}else if(coins>=x.p){coins-=x.p;own[id]=1;eq=id}else alert('عملات غير كافية');draw()}
if(location.hash=='#eq'){own.fr_phoenix=1;eq='fr_phoenix';coins-=400}
draw();
</script></body></html>
