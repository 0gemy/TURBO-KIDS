<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#7a1230"><title>TURBO KIDS · لوحة التحكم</title>
<link rel="stylesheet" href="admin/17-cairo2.css">
<style>
:root{color-scheme:light;--bg:#efe9dd;--bg2:#f8f4ec;--card:#fbf8f2;--card2:#f1ebdf;--line:#ddd4c3;--tx:#1d1519;--mut:#7b6f6a;--pri:#7a1230;--pri2:#5a0d23;--acc:#7a1230;--gold:#b07a1a;--ok:#2f6b4f;--warn:#b36a12;--bad:#a3162f;--r:20px;--sh:0 1px 0 #fff8 inset;--ink:#1d1519;--cream:#f7efe2}
:root.dark{color-scheme:dark;--bg:#150f11;--bg2:#1d1517;--card:#231a1d;--card2:#2c2124;--line:#3a2d31;--tx:#f4ede2;--mut:#b3a499;--pri:#b3234a;--pri2:#8e1a3a;--acc:#b3234a;--gold:#d9a441;--bad:#e0556f;--ink:#f4ede2;--cream:#1d1519;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Cairo,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
/* header */
.tb{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--pri);color:var(--cream);display:grid;place-items:center;font-size:20px;transform:rotate(-6deg)}
:root.dark .logo{color:#fff}
.brand b{white-space:nowrap;display:block;font-size:17px;font-weight:800;letter-spacing:.06em;line-height:1.1}.brand small{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px}
.nav{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:99px;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:.15s}
.nav:hover{color:var(--tx)}.nav.on{background:var(--ink);color:var(--cream)}
.nav .cnt{font-size:11px;background:var(--line);color:var(--tx);border-radius:99px;padding:0 7px;line-height:18px}.nav.on .cnt{background:#ffffff26;color:var(--cream)}.nav .cnt:empty{display:none}
.acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:16px;padding:0}.ib:hover{border-color:var(--pri);color:var(--pri)}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 14px 4px 4px;font-size:12px;color:var(--mut);direction:ltr;background:var(--card)}
.chip i{width:30px;height:30px;border-radius:50%;background:var(--pri);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:13px}
.wrap{max-width:1180px;margin:auto;padding:26px 28px 60px}
.ph{margin-bottom:18px}.ph h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--pri2);color:#f7efe2;border-radius:28px;padding:30px 32px;margin-bottom:18px}
.hero:before{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:46%;background:conic-gradient(#ffffff12 25%,transparent 0 50%,#ffffff12 0 75%,transparent 0) 0 0/30px 30px;-webkit-mask-image:linear-gradient(to left,#000,transparent);mask-image:linear-gradient(to left,#000,transparent);transform:scaleX(-1)}
.hero>*{position:relative}
.hero small{letter-spacing:.14em;font-size:12px;opacity:.7;font-weight:700}.hero h2{margin:4px 0 2px;font-size:34px;font-weight:800;letter-spacing:-.01em}.hero p{margin:0;opacity:.75}
.ms{display:grid;grid-template-columns:repeat(4,1fr);margin-top:26px;border-top:1px solid #ffffff2a}
.m{padding:16px 0 0;padding-inline-end:12px}.m+.m{padding-inline-start:20px;border-inline-start:1px solid #ffffff22}
.m span{display:flex;gap:6px;align-items:center;font-size:12px;opacity:.7;font-weight:700}.m b{display:block;font-size:36px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
/* panels */
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.pan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pan h3{margin:0 0 14px;font-size:16px;font-weight:800;display:flex;gap:9px;align-items:center}.pan h3 .i{color:var(--pri)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:6px 0 14px}
.pd{flex:1;max-width:190px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pd .av{width:56px;height:56px;font-size:23px;border-radius:18px}.pd.p1 .av{width:70px;height:70px;font-size:29px;border-radius:22px;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.pd .cr{color:var(--gold);font-size:22px;margin-bottom:-2px}
.pd b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}.pd small{color:var(--mut);font-size:12px}
.step{width:100%;margin-top:10px;border-radius:12px 12px 0 0;background:var(--card2);border:1px solid var(--line);border-bottom:0;display:grid;place-items:start center;padding-top:6px;font-weight:800;font-size:22px;color:var(--mut)}
.p1 .step{height:74px;background:var(--pri);border-color:var(--pri);color:var(--cream)}.p2 .step{height:52px}.p3 .step{height:36px}
.tp{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.tp .n{width:22px;color:var(--mut);font-weight:800;text-align:center}
.tp .av{width:38px;height:38px;border-radius:12px;font-size:16px}
.lg{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.lg:first-of-type{border-top:0}
.lg .d{width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--pri);display:grid;place-items:center;flex:none;position:relative}
.lg small{display:block;color:var(--mut);font-size:12px}
/* avatar & chips */
.av{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#f7efe2;background:var(--c,var(--pri))}
.coin{display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}.coin .i{color:var(--gold)}
.me{font-size:10px;background:var(--ink);color:var(--cream);border-radius:6px;padding:1px 7px;margin-inline-start:6px;font-weight:700}
.pend{color:var(--warn);font-size:12px;font-weight:700}
.mini{color:var(--mut);font-size:13px}.mini b{color:var(--tx)}.mini .i{margin-inline-end:3px}.lab{display:none;color:var(--mut);font-size:12px}
/* toolbar */
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.srch{flex:1;min-width:220px;position:relative}.srch input{width:100%;padding-inline-start:44px;border-radius:99px}.srch .i{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--mut)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;color:var(--cream);background:var(--pri);transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
:root.dark button{color:#fff}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
.b2{background:var(--card);border:1px solid var(--line);color:var(--tx)!important}.b2:hover{border-color:var(--pri);color:var(--pri)!important;filter:none}
.bg{background:var(--ink)}:root.dark .bg{color:var(--cream)}
.bd{background:transparent;border:1px solid var(--bad);color:var(--bad)!important}.bd:hover{background:var(--bad);color:#fff!important;filter:none}
.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.fl button{background:transparent;border:1px solid var(--line);color:var(--mut);padding:6px 14px;border-radius:99px;font-size:13px}.fl button:hover{color:var(--tx);border-color:var(--tx);filter:none}.fl button.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
/* table */
.list{display:block;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.rh,.row{display:grid;grid-template-columns:28px minmax(210px,2.2fr) 1.2fr .9fr 1fr 1fr auto;gap:14px;align-items:center;padding:14px 20px}
.rh{padding-block:11px;background:var(--card2);color:var(--mut);font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);transition:.12s}.row:last-child{border-bottom:0}.row:hover{background:var(--bg2)}
.row.sel{background:color-mix(in srgb,var(--pri) 9%,var(--card))}
.ck{width:19px;height:19px;accent-color:var(--pri);padding:0;cursor:pointer}
.pl{display:flex;align-items:center;gap:12px;min-width:0}.pl div{min-width:0}.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right;font-size:12px}
.lv{display:flex;flex-direction:column;gap:5px}.lv b{font-size:14px;display:flex;gap:6px;align-items:baseline}.lv b em{font-style:normal;font-size:11px;color:var(--mut);letter-spacing:.1em}.lv small{color:var(--mut);font-size:11px}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.act{display:flex;gap:6px;justify-content:flex-end}.act .sm{padding:8px 10px}
.empty{text-align:center;padding:60px 10px;color:var(--mut)}.empty .i{font-size:36px;display:block;margin:0 auto 10px;opacity:.4}
.sk{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}@keyframes sh{to{background-position:-200% 0}}
.bulk{position:sticky;bottom:24px;z-index:15;margin-top:16px;background:var(--ink);color:var(--cream);border-radius:20px;padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 18px 40px #0004}
.bulk b{margin-inline-end:auto;display:flex;gap:8px;align-items:center}
.bulk button{background:#ffffff1c;color:var(--cream)!important;border:0}.bulk .bd{background:var(--bad);color:#fff!important}
:root.dark .bulk button{background:#00000014}
/* sheets */
.ov{position:fixed;inset:0;background:#150a0e99;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fi .15s}@keyframes fi{from{opacity:0}}
.bx{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px #0006;animation:up .22s}@keyframes up{from{transform:translateY(14px);opacity:0}}
.ov:has(.bx.big){justify-content:flex-start;padding:0;align-items:stretch}
.bx.big{max-width:520px;max-height:none;height:100%;border-radius:0 28px 28px 0;border-width:0 0 0 1px;animation:sl .25s}@keyframes sl{from{transform:translateX(40px);opacity:0}}
.bx h3{margin:0 0 4px;font-size:20px;font-weight:800}.bx p{color:var(--mut);margin:6px 0}.bx label{display:block;color:var(--mut);font-size:13px;margin:14px 0 5px}.bx input{width:100%}
.btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.quick{display:flex;gap:8px;margin:10px 0}.quick button{flex:1;background:var(--card);color:var(--tx)!important;border:1px solid var(--line);font-size:16px;padding:12px 6px}.quick button:hover{border-color:var(--pri);color:var(--pri)!important;filter:none}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.sum span{background:var(--card2);border-radius:99px;padding:4px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}.sum .i{color:var(--pri)}
.sec{margin-top:20px}.sec h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:800;display:flex;gap:8px;align-items:center;letter-spacing:.04em}.sec h4 .i{color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.grid button{background:var(--card);border:1px solid var(--line);color:var(--tx)!important;justify-content:flex-start;text-align:start;padding:10px 12px;font-size:13px;border-radius:12px}.grid button:hover{border-color:var(--pri);color:var(--pri)!important;filter:none}
.grid button.d{color:var(--bad)!important}.grid button.d:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.msg{padding:90px 20px;text-align:center;color:var(--mut)}.msg h2{color:var(--tx)}.msg a{color:var(--pri)}
.toast{position:fixed;bottom:96px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--ink);color:var(--cream);padding:11px 20px;border-radius:14px;z-index:99;display:flex;gap:8px;align-items:center;font-weight:700;box-shadow:0 12px 30px #0003}.toast.e{background:var(--bad);color:#fff}
.bot{display:none}
@media(max-width:900px){
.tb{grid-template-columns:1fr auto;padding:12px 16px}.tabs{display:none}.chip span{display:none}.chip{padding:4px}
.wrap{padding:16px 14px 120px}.ph h1{font-size:24px}
.hero{padding:22px 20px;border-radius:24px}.hero h2{font-size:26px}.ms{grid-template-columns:repeat(2,1fr)}.m b{font-size:28px}.m:nth-child(3){padding-inline-start:0;border-inline-start:0}.m:nth-child(n+3){border-top:1px solid #ffffff22;margin-top:12px}
.cols{grid-template-columns:minmax(0,1fr)}
.bot{display:flex;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline:16px;z-index:40;background:var(--ink);border-radius:24px;padding:6px;gap:4px;box-shadow:0 16px 36px #0005}
.bot .nav{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:8px 4px;color:#b9aaa2;border-radius:18px;justify-content:center}:root.dark .bot .nav{color:#8d7f77}.bot .nav .i{font-size:20px}.bot .nav .cnt{display:none}.bot .nav.on{background:var(--pri);color:#fff}
.rh{display:flex;padding:10px 16px}.rh span:nth-child(n+3){display:none}
.row{grid-template-columns:28px minmax(0,1fr);gap:10px 12px;padding:16px}
.row>.pl{grid-column:2}.row>.lv,.row>div:not(.pl):not(.act){grid-column:1/-1}
.row>div:not(.pl):not(.lv):not(.act){display:flex;justify-content:space-between;align-items:center}.lab{display:inline}
.lv .lab{display:none}.row>.lv{flex-direction:column}.act{grid-column:1/-1;justify-content:stretch}.act button{flex:1;padding:10px}
.bulk{bottom:96px}
.toast{bottom:104px}
.ov:has(.bx.big),.ov{align-items:flex-end;padding:0;justify-content:center}
.bx,.bx.big{max-width:none;width:100%;height:auto;max-height:90vh;border-radius:26px 26px 0 0;border-width:1px 0 0}
.pd .av{width:48px;height:48px}.pd.p1 .av{width:60px;height:60px}
}
</style></head><body>

 $('lst').innerHTML=L.length?'<div class="rh"><input type="checkbox" class="ck" id="all"'+(L.every(r=>sel.has(r.id))?' checked':'')+'><span>اللاعب ('+L.length+')</span><span>المستوى</span><span>الكوينز</span><span>النجوم · المراحل</span><span>آخر نشاط</span><span></span></div>'+L.map(r=>{const a=base(r.lv),b=base(r.lv+1),p=Math.max(0,Math.min(1,(r.xp-a)/(b-a))),me=G&&r.id===G.id;
  return '<div class="row'+(sel.has(r.id)?' sel':'')+'"><input type="checkbox" class="ck" data-s="'+r.id+'"'+(sel.has(r.id)?' checked':'')+'><div class="pl">'+avatar(r)+'<div><b>'+E(r.nm)+(me?'<span class="me">أنت</span>':'')+'</b><small>'+E(r.email)+'</small></div></div>'+
  '<div class="lv"><span class="lab">المستوى</span><b><em>LV</em>'+r.lv+'</b><div class="bar"><i style="width:'+Math.round(p*100)+'%"></i></div><small>'+N(r.xp)+' XP</small></div>'+
  '<div><span class="lab">الكوينز</span><span class="coin">'+ic('coins')+' '+N(r.coins)+'</span></div>'+
  '<div class="mini"><span class="lab">النجوم / المراحل</span><svg class="i"><use href="#i-star"/></svg><b>'+N(r.ns)+'</b> &nbsp;<svg class="i"><use href="#i-flag-checkered"/></svg><b>'+N(r.nl)+'</b></div>'+
  '<div class="mini"><span class="lab">آخر نشاط</span>'+ago(r.updated_at)+(r.np?'<div class="pend" title="تغييرات هتتطبق لما اللاعب يفتح اللعبة">'+ic('hourglass-half')+' '+r.np+' معلّق</div>':'')+'</div>'+
  '<div class="act"><button class="sm" data-a="all" title="تحكم كامل">'+ic('sliders')+' تحكم</button><button class="sm b2" data-a="add" title="إضافة كوينز">'+ic('circle-plus')+'</button><button class="sm b2" data-a="edit" title="تعديل">'+ic('pen')+'</button>'+'<button class="sm bd" data-a="del" title="حذف"'+(me?' style="visibility:hidden" tabindex="-1"':'')+'>'+ic('trash')+'</button>'+'</div></div>'}).join(''):'<div class="empty">'+ic('user-slash')+(loaded?'مفيش لاعبين مطابقين':'...')+'</div>';
 const rr=id=>rows.find(r=>r.id===id);
 $('lst').querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,rr(b.closest('.row').querySelector('[data-s]').dataset.s)));
 $('lst').querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.s):sel.delete(c.dataset.s);c.closest('.row').classList.toggle('sel',c.checked);bulk();const a=$('all');if(a)a.checked=L.every(r=>sel.has(r.id))});
 const al=$('all');if(al)al.onchange=()=>{L.forEach(r=>al.checked?sel.add(r.id):sel.delete(r.id));list()};bulk()}
function bulk(){const n=sel.size,b=$('bk');if(!b)return;
 b.innerHTML=n?'<div class="bulk"><b>'+ic('square-check')+' تم تحديد '+n+' لاعب</b><button class="sm bg" id="b1">'+ic('coins')+'إضافة كوينز</button><button class="sm" id="b2">'+ic('lock-open')+'فتح كل حاجة</button><button class="sm bd" id="b3">'+ic('trash')+'حذف</button><button class="sm b2" id="b4">'+ic('xmark')+'إلغاء التحديد</button></div>':'';
 if(!n)return;const S=()=>rows.filter(r=>sel.has(r.id));
 $('b4').onclick=()=>{sel.clear();list()};
 $('b1').onclick=()=>coinBox(S());
 $('b2').onclick=()=>confirm2(S(),'فتح كل حاجة لـ '+n+' لاعب','هتتطبق لما كل لاعب يفتح اللعبة.',1,async o=>{let k=0;for(const r of S()){if(await rpcQ('admin_cmd',{uid:r.id,cmd:{a:'unlock_all',n:0}}))k++}toast('اتبعت لـ '+k+' لاعب');logA('lock-open','فتح كل حاجة لـ '+k+' لاعب');await load();return 1});
 $('b3').onclick=()=>{const T=S().filter(r=>!(G&&r.id===G.id));if(!T.length)return toast('مينفعش تحذف حسابك',1);confirm2(T,'حذف '+T.length+' حساب نهائيًا','هتتحذف الحسابات وكل تقدمها ومش هتتسترجع.',2,async o=>{let k=0;for(const r of T){if(await rpcQ('admin_delete',{uid:r.id}))k++}toast('اتحذف '+k+' حساب');logA('trash','حذف '+k+' حساب');sel.clear();await load();return 1})}}
function box(h,big){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="bx'+(big?' big':'')+'">'+h+'</div>';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};document.addEventListener('keydown',function k(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',k)}});return o}
const head=r=>'<h3>'+E(r.nm)+'</h3><p style="direction:ltr;text-align:right">'+E(r.email)+'</p>';
async function rpcQ(fn,body){try{await api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(body)});return 1}catch(e){toast('فشل: '+e.message,1);return 0}}
async function rpc(fn,body,o,okMsg){const b=o&&o.querySelector('#ok');if(b)b.disabled=true;const x=await rpcQ(fn,body);if(x)toast(okMsg||'تم ✓');else if(b)b.disabled=false;return x}
// coins: quick buttons + free number; works for one or many players
function coinBox(T){const one=T.length===1,r=T[0];
 const o=box((one?head(r)+'<div class="sum"><span>'+ic('coins')+' الرصيد: <b id="bal">'+N(r.coins)+'</b></span></div>':'<h3>إضافة كوينز</h3><p>لـ '+T.length+' لاعب</p>')+'<label>إضافة سريعة</label><div class="quick"><button data-n="100">+100</button><button data-n="500">+500</button><button data-n="1000">+1000</button></div><label>رقم حر (سالب للخصم)</label><input id="n" type="number" inputmode="numeric" placeholder="مثال: 2500"><div class="btns"><button class="bg" id="ok">'+ic('plus')+'إضافة</button><button class="b2" id="no">إغلاق</button></div>');
 o.querySelector('#no').onclick=()=>o.remove();
 async function add(n,b){if(!n)return toast('اكتب رقم',1);if(b)b.disabled=true;let k=0;for(const p of T){if(await rpcQ('admin_op',{uid:p.id,op:{t:'add',k:'coins',n}})){k++;p.coins+=n}}if(b)b.disabled=false;
  if(k){toast((n>0?'+':'')+N(n)+' كوينز'+(one?'':' لـ '+k+' لاعب')+' ✓');logA('coins',(n>0?'إضافة ':'خصم ')+N(Math.abs(n))+' كوينز — '+(one?r.nm:k+' لاعب'),G&&G.email);const bl=o.querySelector('#bal');if(bl)bl.textContent=N(r.coins);if(view==='players')list();}}
 o.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>add(+b.dataset.n,b));
 o.querySelector('#ok').onclick=function(){const n=Math.trunc(+o.querySelector('#n').value);add(n,this).then(()=>{o.querySelector('#n').value=''})};o.querySelector('#n').focus()}
const GRP=[
['star','النجوم والألبوم',[['إضافة نجوم…','stars_add'],['كل المراحل ٣ نجوم + فتح الألبوم','stars_all'],['فتح كل المراحل','levels_unlock'],['تصفير النجوم','stars_zero',1],['قفل المراحل والألبوم','levels_lock',1]]],
['trophy','الإنجازات',[['فتح كل الإنجازات','ach_unlock']]],
['car','السيارات',[['فتح كل السيارات','cars_all'],['رجوع لسيارة واحدة','cars_reset',1]]],
['cart-shopping','المتجر',[['كل الثيمات','themes_all'],['كل الطرق','roads_all'],['كل البوابات','gates_all'],['كل العوالم','worlds_all'],['كل الإضافات والإطارات','items_all'],['كل ثيمات الرئيسية','lobby_all'],['قفل الثيمات','themes_reset',1],['قفل الطرق','roads_reset',1],['قفل البوابات','gates_reset',1],['قفل العوالم','worlds_reset',1],['قفل الإضافات','items_reset',1],['قفل ثيمات الرئيسية','lobby_reset',1]]],
['lock-open','الكل',[['فتح كل حاجة في اللعبة','unlock_all'],['تصفير التقدم بالكامل','reset_all',2]]]];
// T = array of players
function confirm2(T,title,body,lvl,fn){const one=T.length===1,key=one?String(T[0].email):'تأكيد';
 const o=box('<h3 style="color:var(--bad)">'+ic('triangle-exclamation')+' '+E(title)+'</h3><p>'+(one?'اللاعب: <b>'+E(T[0].email)+'</b>':'<b>'+T.length+'</b> لاعب: '+E(T.slice(0,4).map(r=>r.nm).join('، '))+(T.length>4?'…':''))+'</p><p>'+body+'</p>'+(lvl>1?'<label>اكتب '+(one?'الإيميل':'كلمة «تأكيد»')+' للتأكيد</label><input id="t" autocomplete="off" dir="'+(one?'ltr':'rtl')+'" placeholder="'+E(key)+'">':'')+'<div class="btns"><button class="bd" id="ok" '+(lvl>1?'disabled':'')+'>'+ic('check')+'تأكيد</button><button class="b2" id="no">إلغاء</button></div>');
 const ok=o.querySelector('#ok');if(lvl>1)o.querySelector('#t').oninput=e=>{ok.disabled=e.target.value.trim().toLowerCase()!==key.toLowerCase()};
 o.querySelector('#no').onclick=()=>o.remove();ok.onclick=async()=>{ok.disabled=true;if(await fn(o))o.remove();else ok.disabled=false}}
const cmd=(r,a,n,o,lbl)=>rpc('admin_cmd',{uid:r.id,cmd:{a,n:n||0}},o,'اتبعت للاعب، هيتطبق أول ما يفتح اللعبة ✓').then(async x=>{if(x){logA('sliders',lbl+' — '+r.nm,G&&G.email);await load()}return x});
function manage(r){const o=box(head(r)+'<div class="sum"><span>مستوى '+r.lv+'</span><span>'+ic('coins')+' '+N(r.coins)+'</span><span>'+ic('star')+' '+N(r.ns)+'</span><span>'+ic('flag-checkered')+' '+N(r.nl)+' مرحلة</span><span>'+ic('car')+' '+r.nc+'</span></div><p style="font-size:13px">التغييرات بتتطبق عند اللاعب أول ما يفتح اللعبة وهو مسجّل دخول.</p>'+GRP.map((g,gi)=>'<div class="sec"><h4>'+ic(g[0])+g[1]+'</h4><div class="grid">'+g[2].map((x,xi)=>'<button class="'+(x[2]?'d':'')+'" data-g="'+gi+'" data-x="'+xi+'">'+x[0]+'</button>').join('')+'</div></div>').join('')+'<div class="btns"><button class="b2" id="no">إغلاق</button></div>',1);
 o.querySelector('#no').onclick=()=>o.remove();
 o.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{const x=GRP[+b.dataset.g][2][+b.dataset.x];
  if(x[1]==='stars_add'){const p=box('<h3>إضافة نجوم</h3><p>'+E(r.email)+'</p><label>العدد (١ إلى ١٠٠٠)</label><input id="n" type="number" min="1" max="1000" inputmode="numeric"><div class="btns"><button class="bg" id="ok">إضافة</button><button class="b2" id="no">إلغاء</button></div>');p.querySelector('#no').onclick=()=>p.remove();p.querySelector('#ok').onclick=async()=>{const n=Math.trunc(+p.querySelector('#n').value);if(!(n>=1&&n<=1000))return toast('اكتب رقم من 1 لـ 1000',1);if(await cmd(r,'stars_add',n,p,'إضافة '+n+' نجمة'))p.remove()};return}
  if(x[2])return confirm2([r],'تأكيد: '+x[0],x[2]>1?'ده هيمسح كل تقدم اللاعب ومش هيتسترجع.':'العملية دي بتقفل أو بتمسح حاجات عند اللاعب.',x[2],o2=>cmd(r,x[1],0,o2,x[0]));
  cmd(r,x[1],0,null,x[0])})}
function act(a,r){if(!r)return;
 if(a==='all')return manage(r);
 if(a==='add')return coinBox([r]);
 if(a==='edit'){const o=box(head(r)+'<label>الكوينز</label><input id="c" type="number" value="'+r.coins+'"><label>XP (المستوى الحالي '+r.lv+')</label><input id="x" type="number" value="'+r.xp+'"><div class="btns"><button id="ok">'+ic('floppy-disk')+'حفظ</button><button class="b2" id="no">إلغاء</button></div>');
  o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=async()=>{const c=Math.max(0,Math.trunc(+o.querySelector('#c').value)),x=Math.max(0,Math.trunc(+o.querySelector('#x').value));let k=1;
   if(c!==r.coins)k=await rpc('admin_op',{uid:r.id,op:{t:'set',k:'coins',n:c}},o);if(k&&x!==r.xp)k=await rpc('admin_op',{uid:r.id,op:{t:'set',k:'xp',n:x}},o);if(k){toast('اتحفظ ✓');logA('pen','تعديل بيانات — '+r.nm,G&&G.email);o.remove();load()}}}
 if(a==='del')confirm2([r],'حذف الحساب نهائيًا','هيتحذف الحساب وكل تقدمه ومش هيتسترجع.',2,async o=>{if(await rpcQ('admin_delete',{uid:r.id})){toast('اتحذف ✓');logA('trash','حذف حساب — '+r.email,G&&G.email);load();return 1}})}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('rf').onclick=async()=>{await load();toast('اتحدّث')};
$('th').onclick=()=>{const d=document.documentElement.classList.toggle('dark');localStorage.setItem('tk_adm_theme',d?'dark':'light');$('th').innerHTML=ic(d?'sun':'moon')};
$('th').innerHTML=ic(document.documentElement.classList.contains('dark')?'sun':'moon');
init();
})();
</script></body></html>
