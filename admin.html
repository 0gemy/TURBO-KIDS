<!DOCTYPE html>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset-inline-start:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--c,#4f8cff);opacity:.12}

input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px #4f8cff33}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;color:#fff;background:var(--pri2);transition:.15s}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
.b2{background:var(--card2);border:1px solid var(--line);color:var(--tx)}.bg{background:#15803d}.bd{background:#b91c1c}.bw{background:#b45309}.sm{padding:6px 10px;font-size:13px;border-radius:10px}

.act{display:flex;gap:6px;justify-content:flex-end}.pend{color:var(--warn);font-size:12px;font-weight:700}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}

.bx{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px #000a;animation:up .2s}@keyframes up{from{transform:translateY(16px);opacity:0}}
.bx.big{max-width:620px}.bx h3{margin:0 0 4px;font-size:19px}.bx p{color:var(--mut);margin:6px 0}.bx label{display:block;color:var(--mut);font-size:13px;margin:12px 0 4px}.bx input{width:100%}
.btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-start;flex-wrap:wrap}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.sum span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.sec{margin-top:16px}.sec h4{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.grid button{background:var(--card);border:1px solid var(--line);color:var(--tx);text-align:right;padding:10px 12px;font-size:13px}.grid button:hover{border-color:var(--pri)}.grid button.d{color:#fca5a5}.grid button.d:hover{border-color:var(--bad)}
.tab{display:flex;gap:6px;margin-top:14px;background:var(--card);border-radius:12px;padding:4px}.tab button{flex:1;background:none;color:var(--mut)}.tab button.on{background:var(--card2);color:var(--tx)}
.msg{padding:60px 20px;text-align:center;color:var(--mut)}.msg h2{color:var(--tx)}.msg a{color:var(--pri)}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:#0f2a1a;border:1px solid #166534;color:#bbf7d0;padding:10px 18px;border-radius:12px;z-index:99;font-weight:700;animation:up .2s}.toast.e{background:#2a0f12;border-color:#7f1d1d;color:#fecaca}
@media(max-width:820px){.row{grid-template-columns:1fr 1fr;gap:10px}.row.head{display:none}.row .pl{grid-column:1/-1}.act{grid-column:1/-1;justify-content:stretch}.act button{flex:1}.lab{display:block}.row .lv{grid-column:1/-1}}

<script>
(function(){

async function tok(){if(!G)return null;if(G.exp-Date.now()>6e4)return G.at;
 const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:hd(KEY),body:JSON.stringify({refresh_token:G.rt})});const j=await r.json();
 if(!j.access_token)return null;G=Object.assign({},G,{at:j.access_token,rt:j.refresh_token||G.rt,exp:Date.now()+(j.expires_in||3600)*1e3});localStorage.setItem('tk_g',JSON.stringify(G));return G.at}

async function init(){
 if(!G){msg('<h2>سجّل دخول الأول</h2>افتح اللعبة وسجّل الدخول بحساب Google بتاعك، وبعدين ارجع هنا.<br><br><a href="/">فتح اللعبة ←</a>');return}

 const L=x=>Array.isArray(x)?x.length:0;
 rows.forEach(r=>{r.coins=+r.coins||0;r.xp=+r.xp||0;r.lv=lvOf(r.xp);r.nc=L(r.cars);r.ns=r.stars&&typeof r.stars==='object'?Object.values(r.stars).reduce((a,b)=>a+(+b||0),0):0;r.nl=r.cl&&typeof r.cl==='object'?Object.keys(r.cl).length:0;r.ni=L(r.oT)+L(r.oR)+L(r.oG)+L(r.oI)+L(r.oW)+L(r.oL);r.np=L(r.ops);r.t=r.updated_at?+new Date(r.updated_at):0;r.nm=r.name||(r.email||'?').split('@')[0]});
 loaded=1;draw()}
function kpi(i,l,v,c){return '<div class="kpi" style="--c:'+c+'"><span>'+i+' '+l+'</span><b>'+v+'</b></div>'}
function draw(){
 const day=Date.now()-864e5,wk=Date.now()-6048e5,tc=rows.reduce((a,r)=>a+r.coins,0),av=rows.length?rows.reduce((a,r)=>a+r.lv,0)/rows.length:0;

 const th=(k,l)=>'<span data-k="'+k+'" class="'+(sortK===k?'on':'')+'">'+l+(sortK===k?(dir<0?' ↓':' ↑'):'')+'</span>';
 app.innerHTML='<div class="kpis">'+kpi('👥','اللاعبين',N(rows.length),'#4f8cff')+kpi('🟢','نشطين اليوم',N(rows.filter(r=>r.t>day).length),'#22c55e')+kpi('📅','نشطين الأسبوع',N(rows.filter(r=>r.t>wk).length),'#06b6d4')+kpi('💎','مجموع العملات',N(tc),'#fbbf24')+kpi('🏅','متوسط المستوى',av.toFixed(1),'#a855f7')+'</div>'+
 '<div class="tool"><div class="srch"><span>🔎</span><input id="q" placeholder="ابحث بالإيميل أو الاسم" value="'+E(q)+'"></div><button class="b2" id="rf">🔄 تحديث</button></div>'+
 '<div class="list"><div class="row head">'+th('nm','اللاعب')+th('lv','المستوى')+th('coins','العملات')+th('ns','النجوم / المراحل')+th('t','آخر نشاط')+'<span></span></div>'+
 (L.length?L.map(r=>{const a=base(r.lv),b=base(r.lv+1),p=Math.max(0,Math.min(1,(r.xp-a)/(b-a))),me=G&&r.id===G.id;
  return '<div class="row"><div class="pl"><div class="av" style="--g:linear-gradient(135deg,'+grad(r.email)+')">'+E((r.nm||'?')[0].toUpperCase())+'</div><div><b>'+E(r.nm)+(me?'<span class="me">أنت</span>':'')+'</b><small>'+E(r.email)+'</small></div></div>'+
  '<div class="lv"><span class="lab">المستوى</span><b>مستوى '+r.lv+'</b><div class="bar"><i style="width:'+Math.round(p*100)+'%"></i></div><small>'+N(r.xp)+' XP</small></div>'+
  '<div><span class="lab">العملات</span><span class="coin">💎 '+N(r.coins)+'</span></div>'+
  '<div class="mini"><span class="lab">النجوم / المراحل</span>⭐ <b>'+N(r.ns)+'</b> · 🏁 <b>'+N(r.nl)+'</b></div>'+

  '<div class="act"><button class="sm" data-a="all" data-i="'+r.id+'">⚙️ تحكم</button><button class="sm b2" data-a="add" data-i="'+r.id+'">＋💎</button><button class="sm b2" data-a="edit" data-i="'+r.id+'">✏️</button>'+(me?'':'<button class="sm bd" data-a="del" data-i="'+r.id+'">🗑</button>')+'</div></div>'}).join(''):'<div class="empty">'+(loaded?'مفيش لاعبين مطابقين':'...')+'</div>')+'</div>';
 $('q').oninput=e=>{q=e.target.value.toLowerCase();const p=e.target.selectionStart;draw();const n=$('q');n.focus();n.setSelectionRange(p,p)};
 $('rf').onclick=async()=>{await load();toast('اتحدّث ✓')};
 app.querySelectorAll('.head span[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(sortK===k)dir=-dir;else{sortK=k;dir=-1}draw()});

function box(h,big){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="bx'+(big?' big':'')+'">'+h+'</div>';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};document.addEventListener('keydown',function k(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',k)}});return o}

['⭐ النجوم والألبوم',[['إضافة نجوم…','stars_add'],['كل المراحل ٣ نجوم + فتح الألبوم','stars_all'],['فتح كل المراحل','levels_unlock'],['تصفير النجوم','stars_zero',1],['قفل المراحل والألبوم','levels_lock',1]]],

 o.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{const x=GRP[+b.dataset.g][1][+b.dataset.x];
  if(x[1]==='stars_add'){const p=box('<h3>إضافة نجوم</h3><p>'+E(r.email)+'</p><label>العدد (١ إلى ١٠٠٠)</label><input id="n" type="number" min="1" max="1000" inputmode="numeric"><div class="btns"><button class="bg" id="ok">إضافة</button><button class="b2" id="no">إلغاء</button></div>');p.querySelector('#no').onclick=()=>p.remove();p.querySelector('#ok').onclick=async()=>{const n=Math.trunc(+p.querySelector('#n').value);if(!(n>=1&&n<=1000))return toast('اكتب رقم من 1 لـ 1000',1);if(await cmd(r,'stars_add',n,p))p.remove()};return}
  if(x[2])return confirm2(r,'تأكيد: '+x[0],x[2]>1?'ده هيمسح كل تقدم اللاعب ومش هيتسترجع.':'العملية دي بتقفل أو بتمسح حاجات عند اللاعب.',x[2],o2=>cmd(r,x[1],0,o2));
  cmd(r,x[1],0,null)})}
function act(a,r){if(!r)return;
 if(a==='all')return manage(r);
 if(a==='add'){const o=box(head(r)+'<label>إضافة عملات (رقم سالب للخصم)</label><input id="n" type="number" inputmode="numeric" placeholder="مثال: 500"><div class="btns"><button class="bg" id="ok">إضافة</button><button class="b2" id="no">إلغاء</button></div>');
  o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{const n=Math.trunc(+o.querySelector('#n').value);if(!n)return toast('اكتب رقم',1);op(r.id,{t:'add',k:'coins',n},o)};o.querySelector('#n').focus()}
 if(a==='edit'){const o=box(head(r)+'<label>العملات</label><input id="c" type="number" value="'+r.coins+'"><label>XP (المستوى الحالي '+r.lv+')</label><input id="x" type="number" value="'+r.xp+'"><div class="btns"><button id="ok">حفظ</button><button class="b2" id="no">إلغاء</button></div>');
  o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=async()=>{const c=Math.max(0,Math.trunc(+o.querySelector('#c').value)),x=Math.max(0,Math.trunc(+o.querySelector('#x').value));let k=1;
   if(c!==r.coins)k=await rpc('admin_op',{uid:r.id,op:{t:'set',k:'coins',n:c}},o);if(k&&x!==r.xp)k=await rpc('admin_op',{uid:r.id,op:{t:'set',k:'xp',n:x}},o);if(k){toast('اتحفظ ✓');o.remove();load()}}}
 if(a==='del')confirm2(r,'حذف الحساب نهائيًا','هيتحذف الحساب وكل تقدمه ومش هيتسترجع.',2,async o=>{if(await rpc('admin_delete',{uid:r.id},o,'اتحذف ✓')){load();return 1}})}
init();
})();
</script></body></html>
