function manage(r){const o=box(head(r)+'<div class="sum"><span>مستوى '+r.lv+'</span><span>'+ic('coins')+' '+N(r.coins)+'</span><span>'+ic('star')+' '+N(r.ns)+'</span><span>'+ic('flag-checkered')+' '+N(r.nl)+' مرحلة</span><span>'+ic('car')+' '+r.nc+'</span></div><p style="font-size:13px">التغييرات بتتطبق عند اللاعب أول ما يفتح اللعبة وهو مسجّل دخول.</p>'+GRP.map((g,gi)=>'<div class="sec"><h4>'+ic(g[0])+g[1]+'</h4><div class="grid">'+g[2].map((x,xi)=>'<button class="'+(x[2]?'d':'')+'" data-g="'+gi+'" data-x="'+xi+'">'+x[0]+'</button>').join('')+'</div></div>').join('')+'<div class="btns"><button class="b2" id="no">إغلاق</button></div>',1);
 o.querySelector('#no').onclick=()=>o.remove();
 o.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{const x=GRP[+b.dataset.g][2][+b.dataset.x];
  if(x[1]==='stars_add'){const p=box('<h3>إضافة نجوم</h3><p>'+E(r.email)+'</p><label>العدد (١ إلى ١٠٠٠)</label><input id="n" type="number" min="1" max="1000" inputmode="numeric"><div class="btns"><button class="bg" id="ok">إضافة</button><button class="b2" id="no">إلغاء</button></div>');p.querySelector('#no').onclick=()=>p.remove();p.querySelector('#ok').onclick=async()=>{const n=Math.trunc(+p.querySelector('#n').value);if(!(n>=1&&n<=1000))return toast('اكتب رقم من 1 لـ 1000',1);if(await cmd(r,'stars_add',n,p,'إضافة '+n+' نجمة'))p.remove()};return}
  if(x[2])return confirm2([r],'تأكيد: '+x[0],x[2]>1?'ده هيمسح كل تقدم اللاعب ومش هيتسترجع.':'العملية دي بتقفل أو بتمسح حاجات عند اللاعب.',x[2],o2=>cmd(r,x[1],0,o2,x[0]));
  cmd(r,x[1],0,null,x[0])})}
function act(a,r){if(!r)return;
 if(a==='all')return manage(r);
 if(a==='add')return coinBox([r]);
 if(a==='edit'){const o=box(head(r)+'<label>الكوينز</label><input id="c" type="number" value="'+r.coins+'"><label>XP (المستوى الحالي '+r.lv+')</label><input id="x" type="number" value="'+r.xp+'"><div class="btns"><button id="ok">'+ic('floppy-disk')+'حفظ</button><button class="b2" id="no">إلغاء</button></div>');
  o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=async()=>{const c=Math.max(0,Math.trunc(+o.querySelector('#c').value)),x=Math.max(0,Math.trunc(+o.querySelector('#x').value));let k=1;
   if(c!==r.coins)k=await rpc('admin_op',{uid:r.id,op:{t:'set',k:'coins',n:c}},o);if(k&&x!==r.xp)k=await rpc('admin_op',{uid:r.id,op:{t:'set',k:'xp',n:x}},o);if(k){toast('اتحفظ ✓');logA('pen','تعديل بيانات — '+r.nm,G&&G.email);o.remove();load()}}}
 if(a==='del')confirm2([r],'حذف الحساب نهائيًا','هيتحذف الحساب وكل تقدمه ومش هيتسترجع.',2,async o=>{if(await rpcQ('admin_delete',{uid:r.id})){toast('اتحذف ✓');logA('trash','حذف حساب — '+r.email,G&&G.email);load();return 1}})}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('rf').onclick=async()=>{await load();toast('اتحدّث')};
$('th').onclick=()=>{const d=document.documentElement.classList.toggle('dark');localStorage.setItem('tk_adm_theme',d?'dark':'light');$('th').innerHTML=ic(d?'sun':'moon')};
$('th').innerHTML=ic(document.documentElement.classList.contains('dark')?'sun':'moon');
init();
})();
</script></body></html>
